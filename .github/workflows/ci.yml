name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: |
        rm -rf node_modules
        npm ci --include=optional



    - name: Type Check Frontend
      run: npx tsc --noEmit
      working-directory: ./frontend

    - name: Test Frontend
      run: npm run test
      working-directory: ./frontend

    - name: Build Frontend
      run: npm run build
      working-directory: ./frontend

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: |
        rm -rf node_modules
        npm ci --include=optional

    - name: Type Check Backend
      run: npx tsc --noEmit
      working-directory: ./backend

    - name: Test Backend
      run: npm run test
      working-directory: ./backend

    - name: Run E2E Integration Tests
      working-directory: ./backend
      env:
        MONGODB_URI: mongodb://localhost:27017/hostelhub_test
        JWT_SECRET: ci_secret_key_123
        PORT: 8000
      run: |
        npm run dev & 
        npx --yes wait-on -t 30000 http-get://localhost:8000
        npx tsx e2e-test.ts

    - name: Build Backend
      run: npm run build
      working-directory: ./backend